name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Core ist ein Submodule. Solange die Repos privat sind, braucht es ein Token mit Lesezugriff (Secret LAGER_REPO_TOKEN).
      - uses: actions/checkout@v6
        with: { submodules: recursive, token: "${{ secrets.LAGER_REPO_TOKEN || github.token }}" }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci
        working-directory: core
      - run: npm test
      - run: npm run build
