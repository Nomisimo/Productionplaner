# Baut die Installer für Windows (x64) und macOS (Apple Silicon und Intel) und veröffentlicht sie als GitHub-Release.
#
# Auslöser:
#  - auf GitHub unter Actions → Release → „Run workflow“ (oder `gh workflow run release.yml --ref main`):
#    baut main und legt das Release mit dem Tag v<version aus package.json> selbst an
#  - oder ein Tag „v…“, der auf GitHub angelegt wurde
# Versionen mit Bindestrich (…-beta.1) werden als Vorabversion veröffentlicht. Ein Tag muss zur „version“ in package.json passen.
# Mac: ad-hoc signiert (kein Apple-Zertifikat), siehe Hinweis im Release-Text.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: "release-${{ github.ref }}", cancel-in-progress: false }

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win --x64
            kennung: win
          - name: macOS Apple Silicon
            os: macos-latest
            args: --mac --arm64
            kennung: mac-arm64
          # Intel-DMG auf einem Intel-Runner bauen (HFS+-Image, läuft auch auf älteren macOS-Versionen)
          - name: macOS Intel
            os: macos-15-intel
            args: --mac --x64
            kennung: mac-x64
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive, token: "${{ secrets.LAGER_REPO_TOKEN || github.token }}" }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci
        working-directory: core

      - name: Version prüfen
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="$PKG"; fi
          echo "Tag $TAG, package.json $PKG"
          if [ "$TAG" != "$PKG" ]; then echo "::error::Tag $TAG passt nicht zu package.json ($PKG)"; exit 1; fi

      - run: npm test
      - run: npm run build

      - name: Installer bauen
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Mac-Signatur prüfen
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(ls -d dist/mac*/Productionplaner.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          n=$(ls dist/*.dmg | wc -l | tr -d ' ')
          if [ "$n" != "1" ]; then echo "::error::$n DMGs gebaut, erwartet 1"; exit 1; fi
          hdiutil verify dist/*.dmg

      # Update-Dateien je Mac-Architektur getrennt benennen, der Release-Job führt sie zu latest-mac.yml zusammen
      - name: Update-Datei umbenennen
        if: runner.os == 'macOS'
        shell: bash
        run: mv dist/latest-mac.yml "dist/latest-mac-${{ matrix.kennung }}.yml"

      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.kennung }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest*.yml
          if-no-files-found: error

  veroeffentlichen:
    name: GitHub-Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with: { path: artefakte, merge-multiple: true }

      - name: latest-mac.yml zusammenführen
        run: node scripts/latest-mac-zusammen.cjs artefakte

      - name: Tag und Release-Text
        id: notes
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; else TAG="$PKG"; fi
          V="${TAG#v}"
          node -e '
            const v = process.argv[1];
            const src = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const m = src.split(/^## /m).find((s) => s.startsWith("[" + v + "]") || s.startsWith(v));
            console.log(m ? m.split("\n").slice(1).join("\n").trim() : "");
          ' "$V" > notes.md
          cat .github/release-hinweise.md >> notes.md
          echo "prerelease=$([[ "$TAG" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -l artefakte

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Productionplaner ${{ steps.notes.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ steps.notes.outputs.prerelease }}
          files: artefakte/*
